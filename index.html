<title>DCS databases, subdetectors and systems</title>
<style>
:root {
  --bg: #f7f8fa; --fg: #1d2530; --muted: #6a7482; --line: #c9d0da;
  --accent: #1f5fae; --hover: #e8edf4;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191f; --fg: #e3e8ef; --muted: #97a1b0; --line: #3a4350;
    --accent: #7db2ee; --hover: #232a34; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191f; --fg: #e3e8ef; --muted: #97a1b0; --line: #3a4350;
  --accent: #7db2ee; --hover: #232a34; color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 640px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
.hint { margin: 0 0 1.5rem; color: var(--muted); }
summary {
  cursor: pointer; list-style: none; padding: .3rem .4rem; border-radius: 4px;
  display: flex; align-items: baseline; gap: .5rem;
}
summary::-webkit-details-marker { display: none; }
summary::before { content: "\25B8"; color: var(--muted); width: 1em; flex: none; }
details[open] > summary::before { content: "\25BE"; }
summary:hover { background: var(--hover); }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.count { color: var(--muted); font-size: .9rem; }
.db > summary { font-weight: 600; font-size: 1.1rem; color: var(--accent); }
.children { margin-left: .9rem; padding-left: .9rem; border-left: 1px solid var(--line); }
.leaf {
  padding: .15rem .4rem .15rem 1.5rem; overflow-wrap: anywhere;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92rem;
}
a.leaf { display: block; color: inherit; text-decoration: none; border-radius: 4px; }
a.leaf:hover { background: var(--hover); color: var(--accent); }
a.leaf:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#tip {
  position: fixed; z-index: 10; max-width: 20rem; padding: .45rem .65rem; border-radius: 4px;
  background: var(--fg); color: var(--bg); font-size: .85rem; line-height: 1.4;
  pointer-events: none; opacity: 0; transition: opacity .1s; left: 0; top: 0;
}
#tip.on { opacity: 1; }
</style>
</head>

  <div id="tree"></div>
</main>

// A line that matches a subdetector name starts a new group; every other line is a system of the current group.
function parse(db) {
  const groups = new Map(db.subdetectors.split(/\s+/).map(n => [n, []]));
  let current = null;
  for (const raw of db.systems.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    if (groups.has(line)) current = groups.get(line);
    else if (current) current.push(line);
  }
  return groups;
}

// Remember which branches are open, so coming back from an element list (Back button) keeps the tree as it was.
const OPEN_KEY = "dcs-tree-open";
let openSet = new Set();
try { openSet = new Set(JSON.parse(sessionStorage.getItem(OPEN_KEY) || "[]")); } catch (e) {}
function remember(d, key) {
  d.open = openSet.has(key);
  d.addEventListener("toggle", () => {
    if (d.open) openSet.add(key); else openSet.delete(key);
    try { sessionStorage.setItem(OPEN_KEY, JSON.stringify([...openSet])); } catch (e) {}
  });
}

function branch(label, count, className, tip, key) {
  const d = document.createElement("details");
  if (className) d.className = className;
  remember(d, key);
  const s = document.createElement("summary");
  s.append(label);
  s.dataset.tip = tip;
  const c = document.createElement("span");
  c.className = "count";
  c.textContent = "(" + count + ")";
  s.append(c);
  d.append(s);
  const box = document.createElement("div");
  box.className = "children";
  d.append(box);
  return { d, box };
}

const DB_TIPS = {
  ATONR_ADG: "Production database and the default target. Most likely holds the real detector operation data, replicated from the Oracle instance of the same name.",
  INT8R: "Integration database, used for testing. It holds fewer subdetectors than production."
};

// [short name, description used in the hover text]
const SUBS = {
  MDT: ["MDT muon tracking chambers", "the Monitored Drift Tube (MDT) chambers, which track muons: control and monitoring data such as power supplies and front-end electronics"],
  DCS: ["ATLAS-wide DCS", "the central Detector Control System and the infrastructure shared by all detectors (global control stations, common infrastructure controls)"],
  LAR: ["Liquid Argon calorimeter", "the Liquid Argon (LAr) calorimeter, which measures particle energy: high voltage, cryogenic temperatures and readout electronics"],
  TDQ: ["trigger and data-quality systems", "trigger and data-quality hardware (the repo notes call it Timing and Data Quality, and the systems include level-1 trigger and topological trigger electronics)"],
  RPC: ["RPC muon trigger chambers", "the Resistive Plate Chambers, a fast muon detector used for triggering in the barrel"],
  SCT: ["SCT silicon tracker", "the Semiconductor Tracker, a silicon strip tracker in the inner detector"],
  TRT: ["TRT straw tracker", "the Transition Radiation Tracker, the outermost inner-detector tracker, built from gas-filled straw tubes"],
  IDE: ["Inner Detector as a whole", "the Inner Detector as a whole: shared systems such as cooling, environment, magnet and beam monitoring"],
  PIX: ["Pixel detector", "the Pixel detector, the innermost silicon tracker, including the Insertable B-Layer (IBL)"],
  TIL: ["Tile calorimeter", "the Tile Calorimeter (TileCal), the hadronic calorimeter in the barrel"],
  STG: ["sTGC chambers", "the small-strip Thin Gap Chambers (sTGC), part of the New Small Wheel muon upgrade"],
  AFP: ["ATLAS Forward Proton detector", "the ATLAS Forward Proton (AFP) detector, which tags protons scattered at very small angles"],
  LUC: ["LUCID luminosity detector", "LUCID, the Cherenkov detector used to measure luminosity"],
  ZDC: ["Zero Degree Calorimeter", "the Zero Degree Calorimeter, which sits close to the beam line and is used mainly in heavy-ion runs"],
  RPO: ["Roman Pot operations", "the Roman Pot operations, the mechanics that move the AFP detectors close to the beam"],
  MMG: ["Micromegas chambers", "the Micromegas detectors, part of the New Small Wheel muon upgrade"],
  DCSIS: ["DCS Information Server", "the DCS Information Server systems"],
  TGC: ["TGC muon trigger chambers", "the Thin Gap Chambers, which trigger on muons in the end-caps"],
  CSC: ["Cathode Strip Chambers", "the Cathode Strip Chambers, muon tracking chambers in the innermost end-cap region"],
  MUO: ["Muon Spectrometer (top level)", "the top-level control of the Muon Spectrometer, including New Small Wheel infrastructure"]
};

// Name fragments and what they most likely stand for. All matching fragments are combined.
const TOKENS = [
  ["SCS", "sub-detector control station"], ["LCS", "local control station"],
  ["GCS", "global control station"], ["CIC", "common infrastructure controls"],
  ["PS", "power supply"], ["HV", "high voltage"], ["LV", "low voltage"],
  ["ELTX", "front-end electronics"], ["DAQ", "data acquisition"],
  ["DDC", "DAQ-DCS communication"], ["MON", "monitoring"], ["ENV", "environment"],
  ["TEMP", "temperature"], ["COOL", "cooling"], ["CO2", "CO2 cooling"],
  ["MAG", "magnet"], ["RAD", "radiation"], ["BCM", "beam condition monitor"],
  ["BLM", "beam loss monitor"], ["DBM", "diamond beam monitor"], ["FSM", "state machine"],
  ["ILOCK", "interlock"], ["IBL", "Insertable B-Layer"], ["ATCA", "ATCA crate hardware"],
  ["CAN", "CAN bus"], ["LUMI", "luminosity"], ["NGA", "next-generation archiver"],
  ["TST", "test"], ["INF", "infrastructure"], ["SDX1", "SDX1 data centre"],
  ["SR1", "surface building SR1"], ["US15", "USA15 service cavern"], ["UX", "UX15 experiment cavern"]
];

const SYS_NOTES = {
  System1: "Appears in most subdetectors. Probably a default project name. Its meaning is not clear from the data.",
  ATLTDQLV1LCS: "Most likely the local control station of the level-1 trigger.",
  ATLLARCLVTEMP: "Most likely cryogenic low-voltage temperature monitoring data for the Liquid Argon calorimeter."
};

function describeSub(sub) {
  const s = SUBS[sub];
  return s ? "Most likely data from " + s[1] + "." : "No description available.";
}

function describeSystem(name, sub) {
  if (SYS_NOTES[name]) return SYS_NOTES[name];
  if (/^dist_\d+$/.test(name)) return "Probably a link to another WinCC OA system (number " + name.slice(5) + "), not a regular project.";
  const short = (SUBS[sub] || [sub])[0];
  const rest = name.startsWith("ATL") ? name.slice(3) : name;
  const parts = TOKENS.filter(([k]) => rest.includes(k)).map(([, v]) => v);
  return parts.length
    ? "Most likely " + parts.join(", ") + " data for the " + short + "."
    : "Not clear from the name alone. It is one of the projects listed under the " + short + ".";
}

// One shared tooltip that follows the pointer and stays inside the window.
const tip = document.createElement("div");
tip.id = "tip";
document.body.append(tip);
function place(x, y) {
  const r = tip.getBoundingClientRect();
  let left = x + 12, top = y + 14;
  if (left + r.width > innerWidth - 8) left = innerWidth - r.width - 8;
  if (top + r.height > innerHeight - 8) top = y - r.height - 10;
  tip.style.left = Math.max(8, left) + "px";
  tip.style.top = Math.max(8, top) + "px";
}
document.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.classList.remove("on"); return; }
  tip.textContent = t.dataset.tip;
  tip.classList.add("on");
  place(e.clientX, e.clientY);
});
document.addEventListener("mousemove", e => { if (tip.classList.contains("on")) place(e.clientX, e.clientY); });
document.addEventListener("focusin", e => {
  const t = e.target.closest("[data-tip]");
  if (!t || !t.matches(":focus-visible")) return;
  const b = t.getBoundingClientRect();
  tip.textContent = t.dataset.tip;
  tip.classList.add("on");
  place(b.left, b.bottom - 12);
});
document.addEventListener("focusout", () => tip.classList.remove("on"));

const tree = document.getElementById("tree");
for (const [dbName, db] of Object.entries(DATA)) {
  const groups = parse(db);
  const lists = (window.ELEMENT_LISTS || {})[dbName];  // set in config.js; absent = no element lists for this database
  const top = branch(dbName, groups.size, "db", DB_TIPS[dbName], dbName);
  for (const [sub, systems] of groups) {
    const mid = branch(sub, systems.length, "", describeSub(sub), dbName + "/" + sub);
    for (const sys of systems) {
      const linked = lists && !(lists.skip || []).includes(sys);
      const leaf = document.createElement(linked ? "a" : "div");
      if (linked) leaf.href = "elements.html?" + new URLSearchParams({ db: dbName, sub, sys });
      leaf.className = "leaf";
      leaf.textContent = sys;
      leaf.dataset.tip = describeSystem(sys, sub);
      mid.box.append(leaf);
    }
    top.box.append(mid.d);
  }
  tree.append(top.d);
}

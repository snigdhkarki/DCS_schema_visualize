<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DCS elements</title>
<style>
:root {
  --bg: #f7f8fa; --fg: #1d2530; --muted: #6a7482; --line: #c9d0da;
  --accent: #1f5fae; --hover: #e8edf4; --card: #ffffff; --err: #a33a2a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191f; --fg: #e3e8ef; --muted: #97a1b0; --line: #3a4350;
    --accent: #7db2ee; --hover: #232a34; --card: #1b2028; --err: #f0907e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191f; --fg: #e3e8ef; --muted: #97a1b0; --line: #3a4350;
  --accent: #7db2ee; --hover: #232a34; --card: #1b2028; --err: #f0907e; color-scheme: dark;
}
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
a { color: var(--accent); }
a:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.back { display: inline-block; margin-bottom: 1rem; text-decoration: none; padding: .2rem .4rem; margin-left: -.4rem; border-radius: 4px; }
.back:hover { background: var(--hover); }
.crumbs { margin: 0; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
h1 {
  font: 600 1.4rem/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  margin: .1rem 0 .5rem; overflow-wrap: anywhere;
}
.hint { margin: 0 0 1rem; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; margin-bottom: .75rem; }
.bar input, dialog input {
  min-width: 0; padding: .5rem .7rem; font: inherit;
  color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px;
}
.bar input { flex: 1 1 16rem; }
#status { color: var(--muted); font-size: .9rem; }
.btn {
  padding: .45rem .9rem; font: inherit; color: var(--fg); background: var(--card);
  border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
}
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }

#list { padding: .4rem; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
.el {
  display: block; width: 100%; margin: 0; padding: .1rem .6rem; border: 0; border-radius: 4px;
  background: none; color: inherit; text-align: left; cursor: pointer;
  font: .88rem/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  overflow-wrap: anywhere;
  content-visibility: auto; contain-intrinsic-size: auto 1.6em;
}
.el:hover { background: var(--hover); color: var(--accent); }
.empty { margin: 0; padding: .5rem .6rem; color: var(--muted); }

.msg { padding: .9rem 1rem; border: 1px solid var(--line); border-left: 3px solid var(--err); border-radius: 6px; background: var(--card); }
.msg p { margin: .4rem 0 0; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }

dialog {
  width: min(680px, calc(100% - 2rem)); max-height: calc(100dvh - 2rem); overflow: auto; box-sizing: border-box;
  padding: 1rem 1.25rem 1.25rem; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--fg);
}
dialog::backdrop { background: rgba(0, 0, 0, .5); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.dlg-head h2 { margin: 0; font-size: 1.1rem; }
.x { font-size: 1.5rem; line-height: 1; padding: .1rem .5rem; border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 4px; }
.x:hover { background: var(--hover); color: var(--fg); }
.dlg-meta { margin: .6rem 0 0; color: var(--muted); font-size: .9rem; }
.dlg-el {
  margin: .25rem 0 1rem; padding: .45rem .7rem; border-radius: 6px; background: var(--bg); border: 1px solid var(--line);
  font: .88rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere;
}
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .75rem; margin-bottom: .75rem; }
.fields label { display: grid; gap: .25rem; font-size: .9rem; color: var(--muted); }
.fields input { color: var(--fg); }
.err { margin: 0 0 .75rem; color: var(--err); }
.note { margin: .75rem 0 0; color: var(--muted); font-size: .85rem; }
#code {
  margin: 0 0 .75rem; padding: .75rem 1rem; overflow-x: auto; white-space: pre; tab-size: 4;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  font: .85rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.actions { display: flex; flex-wrap: wrap; gap: .6rem; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">&larr; Back to all databases</a>
  <p class="crumbs" id="crumbs"></p>
  <h1 id="title">Loading&hellip;</h1>

  <div id="error" class="msg" hidden></div>

  <div id="content" hidden>
    <p class="hint">Click an element to get the Python code that fetches its archived data.</p>
    <div class="bar">
      <input id="filter" type="search" placeholder="Filter elements, e.g. alarm or channel12" aria-label="Filter elements" autocomplete="off" spellcheck="false">
      <span id="status" role="status" aria-live="polite"></span>
      <button type="button" class="btn" id="copyList">Copy list</button>
      <a id="raw" href="#">Open raw file</a>
    </div>
    <div id="list"></div>
  </div>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <h2 id="dlgTitle">Archived data query</h2>
    <button type="button" class="x" id="dlgClose" aria-label="Close">&times;</button>
  </div>
  <p class="dlg-meta" id="dlgMeta"></p>
  <p class="dlg-el" id="dlgEl"></p>

  <form id="timeForm" novalidate>
    <div class="fields">
      <label>Start time <input type="datetime-local" step="1" id="start" required></label>
      <label>End time <input type="datetime-local" step="1" id="end" required></label>
    </div>
    <p class="err" id="formErr" role="alert" hidden></p>
    <button type="submit" class="btn primary">Generate code</button>
    <p class="note">Times are written into the code exactly as entered. <code>dcs_data</code> decides how they are interpreted.</p>
  </form>

  <div id="result" hidden>
    <pre id="code"></pre>
    <div class="actions">
      <button type="button" class="btn primary" id="copyCode">Copy code</button>
      <button type="button" class="btn" id="editTimes">Change times</button>
    </div>
  </div>
</dialog>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const db = params.get("db") || "", sub = params.get("sub") || "", sys = params.get("sys") || "";
const SAFE = /^[A-Za-z0-9_-]+$/;   // names only, so the URL cannot point at other paths
const DEFAULT_DB = "ATONR_ADG";    // dcs_data's default target; other databases need set_target_database()

// ---------- query code ----------

// "2024-01-10T00:00[:SS]" -> [2024, 1, 10, 0, 0, 0] (no Date object, so no time-zone shifts)
function parseTime(v) {
  const m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)(?::(\d\d))?/.exec(v || "");
  return m ? [m[1], m[2], m[3], m[4], m[5], m[6] || "0"].map(Number) : null;
}

function buildCode(db, sub, element, start, end) {
  const dt = p => "datetime(" + p.join(", ") + ")";
  const out = [
    "from datetime import datetime",
    "import dcs_data",
    "",
    "def example_retrieve_archived_data_simple():",
  ];
  if (db !== DEFAULT_DB) {
    out.push(
      "    # Query the " + db + " database instead of the default (" + DEFAULT_DB + ")",
      "    dcs_data.set_target_database(dcs_data.target_database." + db + ")",
      ""
    );
  }
  out.push(
    "    # From, to time",
    "    start_time = " + dt(start),
    "    end_time = " + dt(end),
    "",
    "    # Fetch elements by name",
    "    archived_data_by_name = dcs_data.get_archived_data_by_name(",
    "        dcs_data.subdetector." + sub + ",",
    "        " + JSON.stringify(element) + ",",   // quotes and backslashes escaped like Python
    "        start_time,",
    "        end_time",
    "    )",
    "",
    "    # Print results",
    "    print(archived_data_by_name)",
    "",
    'if __name__ == "__main__":',
    "    example_retrieve_archived_data_simple()",
    ""
  );
  return out.join("\n");
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const t = document.createElement("textarea");
  t.value = text; t.style.cssText = "position:fixed;opacity:0";
  document.body.append(t); t.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  t.remove();
  return ok;
}

function flash(btn, ok) {
  const old = btn.dataset.label || (btn.dataset.label = btn.textContent);
  btn.textContent = ok ? "Copied" : "Copy failed";
  setTimeout(() => { btn.textContent = old; }, 1500);
}

// ---------- dialog ----------

const dlg = $("dlg");
let currentElement = "";
let lastTimes = null;   // reused for the next element opened on this page

function pad(n) { return String(n).padStart(2, "0"); }
function localStamp(d) {
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" +
         pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}

function showForm() {
  $("result").hidden = true;
  $("timeForm").hidden = false;
  $("start").focus();
}

function openDialog(element) {
  currentElement = element;
  $("dlgEl").textContent = element;
  $("dlgMeta").textContent = "Subdetector " + sub + (db !== DEFAULT_DB ? " · database " + db : "");
  if (!lastTimes) {   // first use: last 24 hours as a starting point
    const now = new Date();
    lastTimes = { start: localStamp(new Date(now.getTime() - 864e5)), end: localStamp(now) };
  }
  $("start").value = lastTimes.start;
  $("end").value = lastTimes.end;
  $("formErr").hidden = true;
  $("result").hidden = true;
  $("timeForm").hidden = false;
  dlg.showModal();
  $("start").focus();
}

$("timeForm").addEventListener("submit", e => {
  e.preventDefault();
  const s = parseTime($("start").value), t = parseTime($("end").value);
  const err = $("formErr");
  if (!s || !t) { err.textContent = "Enter both a start and an end time."; err.hidden = false; return; }
  const key = p => p.map(v => String(v).padStart(2, "0")).join("");   // year, month, ... compare as text
  if (key(t) <= key(s)) { err.textContent = "The end time must be after the start time."; err.hidden = false; return; }
  err.hidden = true;
  lastTimes = { start: $("start").value, end: $("end").value };
  $("code").textContent = buildCode(db, sub, currentElement, s, t);
  $("timeForm").hidden = true;
  $("result").hidden = false;
  $("copyCode").focus();
});

$("editTimes").addEventListener("click", showForm);
$("copyCode").addEventListener("click", async e => flash(e.currentTarget, await copyText($("code").textContent)));
$("dlgClose").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });   // click on the dimmed backdrop

// ---------- page ----------

function fail(heading, detail) {
  $("title").textContent = sys || "DCS elements";
  $("error").hidden = false;
  const strong = document.createElement("strong");
  strong.textContent = heading;
  $("error").replaceChildren(strong);
  if (detail) {
    const p = document.createElement("p");
    p.append(...detail);
    $("error").append(p);
  }
}

function code(text) { const c = document.createElement("code"); c.textContent = text; return c; }
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

async function main() {
  $("crumbs").textContent = [db, sub].filter(Boolean).join(" › ");
  document.title = (sys ? sys + " – " : "") + "DCS elements";

  if (![db, sub, sys].every(v => SAFE.test(v))) {
    return fail("This link is incomplete.", ["Open a system from the list on the ", Object.assign(document.createElement("a"), { href: "index.html", textContent: "main page" }), "."]);
  }
  const cfg = (window.ELEMENT_LISTS || {})[db];
  if (!cfg) return fail("There are no element lists for " + db + ".");
  if ((cfg.skip || []).includes(sys)) return fail(sys + " has no element list.");

  const url = cfg.dir + "/" + encodeURIComponent(sub) + "/" + encodeURIComponent(sys);
  $("title").textContent = sys;

  let text;
  try {
    const res = await fetch(url);
    if (res.status === 404) {
      return fail("No file found for " + sys + ".", ["Expected it at ", code(url), " next to this page."]);
    }
    if (!res.ok) return fail("Could not load the list (HTTP " + res.status + ").", ["File: ", code(url)]);
    text = await res.text();
  } catch (e) {
    return fail("Could not load the list.", [
      "Browsers block pages opened straight from disk (", code("file://"), ") from reading other files. Serve this folder instead, for example by running ",
      code("python -m http.server"), " in it and opening ", code("http://localhost:8000"), "."
    ]);
  }

  const lines = text.split(/\r?\n/).filter(Boolean);
  const lower = lines.map(l => l.toLowerCase());
  const n = lines.length.toLocaleString();
  let shown = [];   // indexes into lines

  $("raw").href = url;
  $("content").hidden = false;

  function render() {
    const q = $("filter").value.trim().toLowerCase();
    shown = [];
    for (let i = 0; i < lines.length; i++) if (!q || lower[i].includes(q)) shown.push(i);
    $("status").textContent = q ? shown.length.toLocaleString() + " of " + n + " elements" : n + " elements";
    $("copyList").disabled = !shown.length;
    $("list").innerHTML = shown.length
      ? shown.map(i => '<button type="button" class="el" data-i="' + i + '">' + esc(lines[i]) + "</button>").join("")
      : '<p class="empty">' + (lines.length ? "No elements match." : "This file is empty.") + "</p>";
  }

  $("list").addEventListener("click", e => {
    const b = e.target.closest(".el");
    if (b) openDialog(lines[+b.dataset.i]);
  });
  $("copyList").addEventListener("click", async e => flash(e.currentTarget, await copyText(shown.map(i => lines[i]).join("\n"))));

  let timer;
  $("filter").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(render, 150); });
  render();
}
main();
</script>
</body>
</html>

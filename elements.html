<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DCS elements</title>
<style>
:root {
  --bg: #f7f8fa; --fg: #1d2530; --muted: #6a7482; --line: #c9d0da;
  --accent: #1f5fae; --hover: #e8edf4; --card: #ffffff; --err: #a33a2a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191f; --fg: #e3e8ef; --muted: #97a1b0; --line: #3a4350;
    --accent: #7db2ee; --hover: #232a34; --card: #1b2028; --err: #f0907e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191f; --fg: #e3e8ef; --muted: #97a1b0; --line: #3a4350;
  --accent: #7db2ee; --hover: #232a34; --card: #1b2028; --err: #f0907e; color-scheme: dark;
}
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
a { color: var(--accent); }
a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.back { display: inline-block; margin-bottom: 1rem; text-decoration: none; padding: .2rem .4rem; margin-left: -.4rem; border-radius: 4px; }
.back:hover { background: var(--hover); }
.crumbs { margin: 0; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
h1 {
  font: 600 1.4rem/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  margin: .1rem 0 1rem; overflow-wrap: anywhere;
}
.bar { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; margin-bottom: .75rem; }
.bar input {
  flex: 1 1 16rem; min-width: 0; padding: .5rem .7rem; font: inherit;
  color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px;
}
#status { color: var(--muted); font-size: .9rem; }
#list {
  margin: 0; padding: .75rem 1rem; background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  font: .88rem/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg { padding: .9rem 1rem; border: 1px solid var(--line); border-left: 3px solid var(--err); border-radius: 6px; background: var(--card); }
.msg p { margin: .4rem 0 0; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">&larr; Back to all databases</a>
  <p class="crumbs" id="crumbs"></p>
  <h1 id="title">Loading&hellip;</h1>

  <div id="error" class="msg" hidden></div>

  <div id="content" hidden>
    <div class="bar">
      <input id="filter" type="search" placeholder="Filter elements, e.g. alarm or channel12" aria-label="Filter elements" autocomplete="off" spellcheck="false">
      <span id="status" role="status" aria-live="polite"></span>
      <a id="raw" href="#">Open raw file</a>
    </div>
    <pre id="list"></pre>
  </div>
</main>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const db = params.get("db") || "", sub = params.get("sub") || "", sys = params.get("sys") || "";
const SAFE = /^[A-Za-z0-9_-]+$/;   // names only, so the URL cannot point at other paths

function fail(heading, detail) {
  $("title").textContent = sys || "DCS elements";
  $("error").hidden = false;
  const strong = document.createElement("strong");
  strong.textContent = heading;
  $("error").replaceChildren(strong);
  if (detail) {
    const p = document.createElement("p");
    p.append(...detail);
    $("error").append(p);
  }
}

function code(text) { const c = document.createElement("code"); c.textContent = text; return c; }

async function main() {
  $("crumbs").textContent = [db, sub].filter(Boolean).join(" › ");
  document.title = (sys ? sys + " – " : "") + "DCS elements";

  if (![db, sub, sys].every(v => SAFE.test(v))) {
    return fail("This link is incomplete.", ["Open a system from the list on the ", Object.assign(document.createElement("a"), { href: "index.html", textContent: "main page" }), "."]);
  }
  const cfg = (window.ELEMENT_LISTS || {})[db];
  if (!cfg) return fail("There are no element lists for " + db + ".");
  if ((cfg.skip || []).includes(sys)) return fail(sys + " has no element list.");

  const url = cfg.dir + "/" + encodeURIComponent(sub) + "/" + encodeURIComponent(sys);
  $("title").textContent = sys;

  let text;
  try {
    const res = await fetch(url);
    if (res.status === 404) {
      return fail("No file found for " + sys + ".", ["Expected it at ", code(url), " next to this page."]);
    }
    if (!res.ok) return fail("Could not load the list (HTTP " + res.status + ").", ["File: ", code(url)]);
    text = await res.text();
  } catch (e) {
    return fail("Could not load the list.", [
      "Browsers block pages opened straight from disk (", code("file://"), ") from reading other files. Serve this folder instead, for example by running ",
      code("python -m http.server"), " in it and opening ", code("http://localhost:8000"), "."
    ]);
  }

  const lines = text.split(/\r?\n/).filter(Boolean);
  const lower = lines.map(l => l.toLowerCase());
  const n = lines.length.toLocaleString();

  $("raw").href = url;
  $("content").hidden = false;

  function render() {
    const q = $("filter").value.trim().toLowerCase();
    if (!lines.length) {
      $("list").textContent = "This file is empty.";
      $("status").textContent = "0 elements";
      return;
    }
    const shown = q ? lines.filter((_, i) => lower[i].includes(q)) : lines;
    $("list").textContent = shown.length ? shown.join("\n") : "No elements match.";
    $("status").textContent = q ? shown.length.toLocaleString() + " of " + n + " elements" : n + " elements";
  }

  let timer;
  $("filter").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(render, 150); });
  render();
}
main();
</script>
</body>
</html>
